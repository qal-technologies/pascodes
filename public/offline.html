<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>You're Offline - PoshCodes</title>

    <style>
        * {
            transition: all ease 400ms;
            box-sizing: border-box;
            text-decoration: none;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: system-ui, Arial, sans-serif;
            text-align: center;
            width: 100%;
            height: 100%;
            height: 100vh;
            display: grid;
            overflow: hidden;
            place-content: center;
            background: black;
            background: radial-gradient(black 85%, rgb(0, 48, 51));
            transition: all ease 400ms;
            gap: 10px;
            -webkit-user-select: none;
            user-select: none;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: -10px;
            color: rgb(0, 255, 238);
            width: max-content;
            place-self: center;
            gap: 10px;
            display: flex;
            align-items: center;
        }

        p {
            width: 100%;
            max-width: 350px;
            opacity: .8;
            color: white;
            margin-block: 6px;
            text-shadow: 0px 0px 6px rgb(0, 0, 0);
            font-size: 12px;
        }

        a {
            width: max-content;
            min-width: 200px;
            place-self: center;
            background: rgb(0, 255, 247);
            padding: 10px;
            padding-inline: 25px;
            border-radius: 25px;
            border-top-right-radius: 10px;
            border-bottom-left-radius: 8px;
            text-decoration: none;
            color: black;
            font-weight: bolder;
            letter-spacing: .9px;
            margin-top: 60px;
            margin-top: 6vh;
            box-shadow: 0px 0px 12px rgb(0, 255, 247);
        }

        a:hover {
            transform: scale(110%) rotate(-5deg);
        }

        div.backdrop {
            width: 70%;
            height: 70%;
            position: absolute;
            background: transparent;
            z-index: -99;
            place-self: center;
            transform: rotate(10deg);
            box-shadow: 0px 0px 2vh rgb(0, 255, 255), inset -0px 2px 2vh rgb(0, 255, 208);
            border-radius: 50px;
            border: 5px solid rgb(0, 255, 200);
            animation: jiggle 5s ease infinite alternate-reverse;
            opacity: .4;
        }

        @keyframes jiggle {
            from {
                transform: rotate(10deg) scale(100%);
                opacity: .4;
            }

            to {
                transform: rotate(0deg) scale(90%);
                opacity: 1;
            }
        }

        div.offline {
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
            opacity: .2;
            animation: blink 1s ease-in-out infinite alternate;
        }
        @keyframes blink {
            from{
                opacity: .2;
            }
            to{
                opacity: 1;
            }
        }
    </style>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>

<body>
    <div class="backdrop">
    </div>
        <h1><div class="offline"></div>You're Offline</h1>
        <p>You're offline. Some pages are available for offline viewing if you previously opened them while online.</p>
        <a href="/">Go Back Home</a>
</body>

</html>
